<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruta · Recolección inteligente</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/actualizacion.js" defer></script>
</head>

<body>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">♲</span>
      <div>
        <h1>Recolección</h1>
        <p>Monitoreo IoT de contenedores <span id="mode"></span></p></div>
    </div>
    <div id="stats" class="stats" aria-label="Resumen"></div>
    <button id="routeButton" class="accent">Generar ruta</button>
  </header>
  <p id="message" role="status" hidden></p>
  <main>
    <aside class="panel inventory">
      <h2>Contenedores</h2>
      <nav id="levels" aria-label="Nivel de llenado"></nav>
      <details class="unit-filter">
        <summary>Filtrar por unidad</summary>
        <nav id="units" aria-label="Unidad asignada"></nav>
      </details>
      <div id="bins" class="bins"></div>
    </aside>
    <section class="panel workspace">
      <div class="toolbar">
        <nav aria-label="Vista"><button id="showMap" aria-pressed="true">Mapa y ruta</button><button id="showAlerts"
            aria-pressed="false">Alertas</button></nav>
      </div>
      <div id="mapView">
        <div class="map-frame">
          <div id="map" aria-label="Mapa de calles y contenedores"></div>
          <div class="legend"><span class="normal">Normal</span><span class="medium">Medio</span><span
              class="full">Lleno</span></div>
        </div>
        <div id="routeInfo" class="route-info" aria-live="polite"></div>
      </div>
    </section>
    <aside class="panel sidebar" aria-label="Alertas y operación">
      <div id="alerts" class="alerts"></div>
      <div id="details" class="details" aria-label="Detalle del contenedor"></div>
    </aside>
  </main>
  <footer><button id="theme">Tema claro</button></footer>
</body>

</html>
